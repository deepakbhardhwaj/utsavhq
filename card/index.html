<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Digital Card | UTSAVhq</title>
<meta name="description" content="Digital visiting card - powered by UTSAVhq ERP.">
<meta name="theme-color" content="#0E2D55">
<meta property="og:type" content="profile">
<meta property="og:title" content="Digital Card | UTSAVhq">
<meta property="og:description" content="Digital visiting card - powered by UTSAVhq ERP.">
<link rel="icon" href="../favicon.png">
<link rel="canonical" id="canonical_link" href="https://utsavhq.com/card/">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   PUBLIC DIGITAL VISITING CARD
   A standalone, mobile-first page. It reads ONE public Firestore document
   (cards/{username}) and renders it. No login, no app shell, no dependencies
   beyond the Firebase SDK - so it loads fast on any phone.
   ══════════════════════════════════════════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --navy:#0E2D55;
  --navy2:#1B4A85;
  --orange:#ED6F1F;
  --orange2:#F2892F;
  --wa:#25D366;
  --ink:#0F172A;
  --muted:#64748B;
  --line:#E7EDF5;
  --accent:#ED6F1F;
}
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(180deg,#F6F8FC 0%,#EDF2FA 100%);
  color:var(--ink); min-height:100vh; padding:0 0 40px;
}
.wrap { max-width:480px; margin:0 auto; padding:0 14px; }

/* ---------- the card ---------- */
.card {
  background:#fff; border-radius:22px; overflow:hidden; margin-top:18px;
  box-shadow:0 14px 40px rgba(14,45,85,.12); border:1px solid var(--line);
  animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
.cover { height:104px; background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#2563EB 100%); position:relative; overflow:hidden; }
.cover::after { content:''; position:absolute; top:-46px; right:-34px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.07); }
.cover::before { content:''; position:absolute; bottom:-60px; left:14%; width:170px; height:170px; border-radius:50%; background:rgba(237,111,31,.12); }
.cover-badge { position:absolute; top:12px; right:12px; background:rgba(255,255,255,.18); color:#fff; font-size:9.5px; font-weight:900; letter-spacing:.6px; text-transform:uppercase; padding:5px 11px; border-radius:20px; border:1px solid rgba(255,255,255,.22); z-index:2; }

.ident { text-align:center; padding:0 18px; margin-top:-44px; position:relative; z-index:2; }
.plate { display:inline-flex; align-items:center; justify-content:center; background:#fff; border-radius:18px; padding:10px 16px; min-height:60px; min-width:60px; box-shadow:0 12px 30px rgba(14,45,85,.16); border:3px solid #fff; }
.plate img { max-height:46px; max-width:180px; object-fit:contain; display:block; }
.initials { font-size:25px; font-weight:900; color:var(--navy); letter-spacing:-.5px; }
.c-name { font-size:21px; font-weight:900; letter-spacing:-.4px; margin-top:11px; line-height:1.2; }
.c-tag { font-size:12.5px; font-weight:700; color:var(--muted); margin-top:4px; line-height:1.4; }
.c-verified { display:inline-flex; align-items:center; gap:4px; margin-top:9px; background:#EFF6FF; color:#1D4ED8; border:1px solid #DBEAFE; font-size:9.5px; font-weight:900; letter-spacing:.5px; text-transform:uppercase; padding:4px 11px; border-radius:20px; }

/* ---------- quick actions ---------- */
.quick { display:flex; gap:9px; padding:16px 16px 0; }
.qa { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px; border-radius:15px; background:#fff; border:1px solid var(--line); text-decoration:none; color:#334155; font-size:10px; font-weight:800; transition:transform .18s, box-shadow .18s; }
.qa:active { transform:scale(.96); }
.qa .ic { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; background:#F1F5F9; }
.qa.wa .ic { background:rgba(37,211,102,.13); }
.qa.call .ic { background:rgba(237,111,31,.13); }
.qa.mail .ic { background:rgba(37,99,235,.11); }
.qa.map .ic  { background:rgba(220,38,38,.10); }

/* ---------- link list ---------- */
.section { padding:18px 16px 0; }
.section-title { font-size:10px; font-weight:900; color:#94A3B8; text-transform:uppercase; letter-spacing:1px; margin-bottom:9px; }
.link {
  display:flex; align-items:center; gap:12px; padding:13px 14px; background:#fff;
  border:1px solid var(--line); border-radius:15px; text-decoration:none; color:var(--ink);
  margin-bottom:9px; transition:transform .18s, box-shadow .18s, border-color .18s;
}
.link:active { transform:scale(.985); }
.link:hover { box-shadow:0 8px 20px rgba(14,45,85,.09); border-color:#D7E3F2; }
.link .ic { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; background:#F1F5F9; flex-shrink:0; }
.link .tx { flex:1; min-width:0; }
.link .lt { font-size:14px; font-weight:800; }
.link .ls { font-size:11px; font-weight:600; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.link .ch { color:#CBD5E1; font-size:16px; flex-shrink:0; }
.link.wa  .ic { background:rgba(37,211,102,.13); }
.link.ig  .ic { background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF); }
.link.yt  .ic { background:rgba(220,38,38,.11); }
.link.tg  .ic { background:rgba(34,158,217,.13); }
.link.fb  .ic { background:rgba(24,119,242,.12); }
.link.loc .ic { background:rgba(220,38,38,.10); }
.link.upi .ic { background:rgba(16,185,129,.13); }
.link.rev .ic { background:rgba(250,204,21,.18); }

/* ---------- catalogue ---------- */
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.cat { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; color:var(--ink); display:block; transition:transform .18s, box-shadow .18s; }
.cat:active { transform:scale(.98); }
.cat:hover { box-shadow:0 10px 24px rgba(14,45,85,.11); }
.cat-thumb { width:100%; aspect-ratio:16/10; object-fit:cover; background:linear-gradient(135deg,#E8EEF8,#F4F7FC); display:block; }
.cat-noimg { width:100%; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; font-size:26px; background:linear-gradient(135deg,#E8EEF8,#F4F7FC); }
.cat-body { padding:9px 11px 11px; }
.cat-t { font-size:12.5px; font-weight:800; line-height:1.3; }
.cat-s { font-size:10.5px; font-weight:600; color:var(--muted); margin-top:2px; }

/* ---------- save contact + share ---------- */
.acts { display:flex; gap:9px; padding:20px 16px 0; }
.btn { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:13px; border-radius:15px; font-size:13px; font-weight:900; border:none; cursor:pointer; text-decoration:none; transition:transform .18s; }
.btn:active { transform:scale(.97); }
.btn-save { background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; }
.btn-share { background:linear-gradient(135deg,var(--orange2),var(--orange)); color:var(--navy); }

/* ---------- footer ---------- */
.foot { text-align:center; padding:26px 16px 0; }
.foot a { display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--muted); font-size:11.5px; font-weight:700; }
.foot b { color:var(--navy); font-weight:900; }
.foot .cta { display:block; margin-top:11px; font-size:11px; color:#94A3B8; font-weight:600; }
.foot .cta a { color:var(--orange); font-weight:800; font-size:11px; }

/* ---------- states ---------- */
.state { max-width:440px; margin:0 auto; padding:60px 24px; text-align:center; }
.state .em { font-size:44px; margin-bottom:14px; }
.state h1 { font-size:19px; font-weight:900; margin-bottom:8px; }
.state p { font-size:13.5px; color:var(--muted); line-height:1.6; font-weight:600; }
.state a.go { display:inline-block; margin-top:18px; background:linear-gradient(135deg,var(--orange2),var(--orange)); color:var(--navy); text-decoration:none; padding:12px 26px; border-radius:14px; font-size:13.5px; font-weight:900; }
.spinner { width:34px; height:34px; border:3px solid #E2E8F0; border-top-color:var(--orange); border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.hidden { display:none !important; }

@media (min-width:640px) {
  .card { margin-top:34px; }
  .cat-grid { grid-template-columns:1fr 1fr 1fr; }
  .link:hover { transform:translateY(-2px); }
}
@media print { body { background:#fff; } .acts, .foot, .cover-badge { display:none; } }
</style>
</head>
<body>

<!-- ── LOADING ─────────────────────────────────────────────────────────── -->
<div id="state-loading" class="state">
  <div class="spinner"></div>
  <p>Loading card...</p>
</div>

<!-- ── NOT FOUND / DISABLED ────────────────────────────────────────────── -->
<div id="state-error" class="state hidden">
  <div class="em" id="err_em">&#128533;</div>
  <h1 id="err_title">Card not found</h1>
  <p id="err_msg">This digital card does not exist or the link is incorrect.</p>
  <a class="go" href="https://utsavhq.com/">Go to UTSAVhq</a>
</div>

<!-- ── THE CARD ────────────────────────────────────────────────────────── -->
<div id="card_root" class="wrap hidden">
  <main class="card">
    <div class="cover">
      <div class="cover-badge" id="badge">Digital Card</div>
    </div>

    <div class="ident">
      <div class="plate" id="plate"></div>
      <div class="c-name" id="c_name"></div>
      <div class="c-tag" id="c_tag"></div>
      <div class="c-verified" id="c_verified">&#10003; Verified Business</div>
    </div>

    <div class="quick" id="quick"></div>

    <div class="section hidden" id="sec_links">
      <div class="section-title">Connect with us</div>
      <div id="links"></div>
    </div>

    <div class="section hidden" id="sec_cat">
      <div class="section-title" id="cat_title">Our Catalogue</div>
      <div class="cat-grid" id="cat_grid"></div>
    </div>

    <div class="acts">
      <button class="btn btn-save" id="btn_save">&#128190; Save contact</button>
      <button class="btn btn-share" id="btn_share">&#128228; Share</button>
    </div>

    <div class="foot">
      <a href="https://utsavhq.com/">
        <img src="../favicon.png" alt="" style="width:17px;height:17px;border-radius:4px;" onerror="this.style.display='none'">
        Powered by <b>UTSAVhq</b>
      </a>
      <span class="cta">Running an event business? <a href="https://utsavhq.com/">Get UTSAVhq ERP free</a></span>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   DIGITAL CARD - public renderer
   URL format: https://utsavhq.com/card/?u=<username>
   Reads ONE document: cards/{username}  (publicly readable, owner-only write)
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── Firebase (public web config - these values are not secrets, they ship
        in every client build and are protected by the Firestore rules) ── */
  var firebaseConfig = {
    apiKey: "AIzaSyBYsxYCTEEX6mXUUfTIY206iWX1q_cGGek",
    authDomain: "utsavhq.firebaseapp.com",
    projectId: "utsavhq",
    storageBucket: "utsavhq.firebasestorage.app",
    messagingSenderId: "276683646200",
    appId: "1:276683646200:web:52f4f85f8e17e88726c70d"
  };

  /* ── link types: icon + the default label used by the editor ── */
  var LINK_TYPES = {
    whatsapp:  { icon:'&#128172;', label:'WhatsApp',       cls:'wa'  },
    call:      { icon:'&#128222;', label:'Call Now',       cls:'call'},
    email:     { icon:'&#9993;&#65039;', label:'Email Us', cls:'mail'},
    telegram:  { icon:'&#9992;&#65039;', label:'Telegram',  cls:'tg'  },
    instagram: { icon:'&#128247;', label:'Instagram',      cls:'ig'  },
    facebook:  { icon:'&#128077;', label:'Facebook',       cls:'fb'  },
    youtube:   { icon:'&#9654;&#65039;', label:'YouTube',   cls:'yt'  },
    website:   { icon:'&#127760;', label:'Website',        cls:'web' },
    location:  { icon:'&#128205;', label:'Our Location',   cls:'loc' },
    review:    { icon:'&#11088;', label:'Google Reviews',  cls:'rev' },
    justdial:  { icon:'&#128218;', label:'Justdial',       cls:'web' },
    indiamart: { icon:'&#128722;', label:'IndiaMART',      cls:'web' },
    upi:       { icon:'&#128179;', label:'Pay via UPI',    cls:'upi' },
    custom:    { icon:'&#128279;', label:'Link',           cls:'web' }
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(u) {
    u = String(u == null ? '' : u).trim();
    if (!u) return '';
    /* only allow http(s), tel, mailto, upi, and whatsapp links */
    if (/^(https?:|tel:|mailto:|upi:|sms:)/i.test(u)) return u;
    if (/^wa\.me\/|^api\.whatsapp\.com/i.test(u)) return 'https://' + u;
    return 'https://' + u.replace(/^\/+/, '');
  }
  function prettyUrl(u) {
    return String(u || '').replace(/^https?:\/\//i, '').replace(/\/$/, '').slice(0, 60);
  }
  function show(el) { if (el) el.classList.remove('hidden'); }
  function hide(el) { if (el) el.classList.add('hidden'); }

  function fail(em, title, msg) {
    hide($('state-loading'));
    if (em) $('err_em').innerHTML = em;
    if (title) $('err_title').textContent = title;
    if (msg) $('err_msg').textContent = msg;
    show($('state-error'));
  }

  /* ── username from ?u= (also accepts ?u=name/ or a trailing slash) ── */
  var username = '';
  try {
    username = (new URLSearchParams(window.location.search).get('u') || '')
      .trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  } catch (e) {
    var m = window.location.search.match(/[?&]u=([^&#]+)/i);
    username = m ? decodeURIComponent(m[1]).toLowerCase().replace(/[^a-z0-9_-]/g, '') : '';
  }

  if (!username) {
    fail('&#128279;', 'No card selected',
      'This link is missing the card name. Ask for the full link, or scan the QR code again.');
    return;
  }

  /* ── boot Firebase and fetch the card ── */
  var db;
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) {
    fail('&#9888;&#65039;', 'Could not load', 'Please check your internet connection and try again.');
    return;
  }

  db.collection('cards').doc(username).get().then(function (snap) {
    if (!snap.exists) {
      fail('&#128533;', 'Card not found',
        'No digital card exists for "' + esc(username) + '". Please check the link.');
      return;
    }
    var d = snap.data() || {};

    /* the owner can switch the card off from Business Profile */
    if (d.enabled === false) {
      fail('&#128274;', 'Card is switched off',
        'This digital card is currently unavailable. Please contact the business directly.');
      return;
    }

    try { render(d); }
    catch (err) {
      fail('&#9888;&#65039;', 'Card could not be displayed',
        'This card has a problem in its data. Please contact the business.');
    }
  }).catch(function () {
    fail('&#128268;', 'Could not load card',
      'We could not reach the server. Please check your connection and refresh.');
  });

  /* ══════════════════════════════════════════════════════════════════════
     RENDER
     ══════════════════════════════════════════════════════════════════════ */
  function render(d) {
    var name = d.name || d.businessName || 'Our Business';
    var tag = d.tagline || d.desc || '';

    /* page title + share preview */
    document.title = name + ' | Digital Card';
    var og = function (prop, val) {
      var t = document.querySelector('meta[property="' + prop + '"]');
      if (t && val) t.setAttribute('content', val);
    };
    og('og:title', name);
    if (tag) og('og:description', tag);
    if (d.logo) og('og:image', d.logo);
    var canon = $('canonical_link');
    if (canon) canon.setAttribute('href', 'https://utsavhq.com/card/?u=' + encodeURIComponent(username));

    /* logo, or initials */
    var plate = $('plate');
    if (d.logo) {
      plate.innerHTML = '<img src="' + esc(d.logo) + '" alt="' + esc(name) + '" onerror="this.parentNode.innerHTML=\'<span class=&quot;initials&quot;>' + esc(initials(name)) + '</span>\'">';
    } else {
      plate.innerHTML = '<span class="initials">' + esc(initials(name)) + '</span>';
    }

    $('c_name').textContent = name;
    if (tag) { $('c_tag').textContent = tag; } else { $('c_tag').style.display = 'none'; }
    if (d.verified === false) { hide($('c_verified')); }
    if (d.category) { $('badge').textContent = d.category; }

    /* ── quick actions ── */
    var q = [];
    if (d.phone)    q.push(qa('call', 'Call', 'tel:' + digits(d.phone)));
    if (d.whatsapp) q.push(qa('wa',   'WhatsApp', 'https://wa.me/' + waNumber(d.whatsapp || d.phone)));
    if (d.email)    q.push(qa('mail', 'Email', 'mailto:' + d.email));
    if (d.mapUrl || d.address) q.push(qa('map', 'Location', d.mapUrl || ('https://maps.google.com/?q=' + encodeURIComponent(d.address))));
    var qEl = $('quick');
    if (q.length) { qEl.innerHTML = q.join(''); } else { qEl.style.display = 'none'; }

    /* ── link list ──
       The app stores links as a map ({ whatsapp: {...}, youtube: {...} }) so the
       editor can address each type directly. Older cards may hold an array.
       Normalise both shapes into a flat list here. */
    var rawLinks = d.links || [];
    if (!Array.isArray(rawLinks)) {
      rawLinks = Object.keys(rawLinks).map(function (k) {
        var v = rawLinks[k] || {};
        if (!v.type) v.type = k;
        return v;
      });
    }
    var links = rawLinks.filter(function (l) { return l && l.enabled !== false && l.url; });
    var seen = {};
    links = links.filter(function (l) {
      var k = (l.type || 'custom') + '|' + l.url;
      if (seen[k]) return false;
      seen[k] = 1; return true;
    });
    if (links.length) {
      $('links').innerHTML = links.map(function (l) {
        var meta = LINK_TYPES[l.type] || LINK_TYPES.custom;
        var label = l.label || meta.label;
        return '<a class="link ' + meta.cls + '" href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener noreferrer">' +
                 '<div class="ic">' + meta.icon + '</div>' +
                 '<div class="tx"><div class="lt">' + esc(label) + '</div>' +
                 (l.sub ? '<div class="ls">' + esc(l.sub) + '</div>' : (l.type === 'custom' ? '<div class="ls">' + esc(prettyUrl(l.url)) + '</div>' : '')) +
                 '</div><div class="ch">&#8250;</div></a>';
      }).join('');
      show($('sec_links'));
    }

    /* ── catalogue ── */
    var cat = (d.catalog || []).filter(function (c) { return c && c.url; });
    if (cat.length) {
      if (d.catalogTitle) $('cat_title').textContent = d.catalogTitle;
      $('cat_grid').innerHTML = cat.map(function (c) {
        var thumb = c.thumb
          ? '<img class="cat-thumb" src="' + esc(c.thumb) + '" alt="' + esc(c.title || '') + '" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;cat-noimg&quot;>&#128230;</div>\'">'
          : '<div class="cat-noimg">&#128230;</div>';
        return '<a class="cat" href="' + esc(safeUrl(c.url)) + '" target="_blank" rel="noopener noreferrer">' +
                 thumb +
                 '<div class="cat-body"><div class="cat-t">' + esc(c.title || 'View') + '</div>' +
                 (c.sub ? '<div class="cat-s">' + esc(c.sub) + '</div>' : '') +
                 '</div></a>';
      }).join('');
      show($('sec_cat'));
    }

    /* ── save contact (vCard) + share ── */
    $('btn_save').onclick = function () { saveVCard(d, name); };
    $('btn_share').onclick = function () { shareCard(d, name); };

    hide($('state-loading'));
    show($('card_root'));
  }

  function qa(kind, label, href) {
    return '<a class="qa ' + kind + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
             '<span class="ic">' + (kind === 'call' ? '&#128222;' : kind === 'wa' ? '&#128172;' : kind === 'mail' ? '&#9993;&#65039;' : '&#128205;') + '</span>' + esc(label) + '</a>';
  }
  function digits(s) { return String(s || '').replace(/[^\d+]/g, ''); }
  function waNumber(s) {
    var n = String(s || '').replace(/\D/g, '');
    if (n.length === 10) n = '91' + n;
    return n;
  }
  function initials(name) {
    return String(name || 'U').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return (w[0] || '').toUpperCase(); }).join('') || 'U';
  }

  /* ── vCard: lets a visitor save the business straight into their phone ── */
  function saveVCard(d, name) {
    var L = [];
    L.push('BEGIN:VCARD');
    L.push('VERSION:3.0');
    L.push('FN:' + name);
    if (d.owner) L.push('N:' + d.owner + ';;;;');
    L.push('ORG:' + name);
    if (d.tagline) L.push('TITLE:' + d.tagline);
    if (d.phone) { L.push('TEL;TYPE=CELL:' + digits(d.phone)); }
    if (d.whatsapp && d.whatsapp !== d.phone) { L.push('TEL;TYPE=CELL:' + digits(d.whatsapp)); }
    if (d.email) L.push('EMAIL;TYPE=INTERNET:' + d.email);
    if (d.website) L.push('URL:' + safeUrl(d.website));
    if (d.address) L.push('ADR;TYPE=WORK:;;' + d.address.replace(/[\n,]/g, ' ') + ';;;;');
    if (d.logo) L.push('PHOTO;VALUE=URI:' + d.logo);
    L.push('END:VCARD');
    var blob = new Blob([L.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name.replace(/[^\w]+/g, '_') + '.vcf';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* ── share: native sheet on mobile, copy on desktop ── */
  function shareCard(d, name) {
    var url = 'https://utsavhq.com/card/?u=' + encodeURIComponent(username);
    var text = name + ' - digital visiting card';
    if (navigator.share) {
      navigator.share({ title: name, text: text, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }).catch(function () { prompt('Copy this link:', url); });
    } else {
      prompt('Copy this link:', url);
    }
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0E2D55;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:800;z-index:99;box-shadow:0 10px 26px rgba(0,0,0,.24);';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }
})();
</script>
